# The whole service on one machine: database, API, web front door, and a
# sweep job. Cloud-agnostic; deploy/terraform/gcp is the only provider-specific
# part, and all it does is make a VM that runs this.
#
#   cp deploy/env.example deploy/.env      # then fill it in
#   deploy/build.sh                        # build the images on this machine
#   docker compose -f deploy/compose.yaml up -d
#   VULNFRAMEWORK_GITHUB_TOKEN=... deploy/sweep.sh
#
# Only the web service publishes ports. The API and the database are reachable
# only on the compose network: the API trusts identity headers, so it must
# never be reachable except through the proxy that sets them (deploy/Caddyfile).

name: vulnframework

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnframework
      POSTGRES_DB: vulnframework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vulnframework"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: vulnframework-api:${VF_IMAGE_TAG:-v1}
    entrypoint: ["/usr/local/bin/orchestrator"]
    command: ["-dsn", "postgres://vulnframework:${POSTGRES_PASSWORD}@db:5432/vulnframework?sslmode=disable", "-migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: vulnframework-api:${VF_IMAGE_TAG:-v1}
    restart: unless-stopped
    command:
      - "-addr=0.0.0.0:8080"
      - "-dsn=postgres://vulnframework:${POSTGRES_PASSWORD}@db:5432/vulnframework?sslmode=disable"
      - "-calibration=/opt/vf/config/calibration.yaml"
      - "-policy=/opt/vf/config/policy.yaml"
      - "-public-origin=https://${SITE_ADDRESS}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    # No ports: reachable only through web.

  web:
    image: vulnframework-web:${VF_IMAGE_TAG:-v1}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      TLS: ${TLS:-internal}
      LOGIN_USER: ${LOGIN_USER:?set LOGIN_USER in deploy/.env}
      LOGIN_HASH: ${LOGIN_HASH:?set LOGIN_HASH in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # The sweep is a job, not a service: `deploy/sweep.sh` runs it once
  # (a timer runs that daily on the VM). The token is passed in from the
  # caller's environment for this run only and is never written here.
  sweep:
    image: vulnframework-sweep:${VF_IMAGE_TAG:-v1}
    profiles: ["jobs"]
    environment:
      VULNFRAMEWORK_GITHUB_TOKEN: ${VULNFRAMEWORK_GITHUB_TOKEN:-}
    command:
      - "-dsn=postgres://vulnframework:${POSTGRES_PASSWORD}@db:5432/vulnframework?sslmode=disable"
      - "-github"
      - "-github-api=${VULNFRAMEWORK_GITHUB_API:-}"
      # Under the scanner home volume, which the scanner user owns; each
      # repository is deleted after its scan.
      - "-download-root=/home/scanner/repos"
      - "-tools=/opt/vf/config/tools.lock"
      - "-calibration=/opt/vf/config/calibration.yaml"
      - "-policy=/opt/vf/config/policy.yaml"
      - "-kev-url=${KEV_URL:-https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}"
      - "-epss-url=${EPSS_URL:-https://epss.empiricalsecurity.com/epss_scores-current.csv.gz}"
      - "-max-concurrent=${SWEEP_CONCURRENCY:-2}"
    volumes:
      - scanhome:/home/scanner
    depends_on:
      migrate: { condition: service_completed_successfully }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The scan worker: drains the scan queue that the interface, vfctl and the
  # daily timer fill. Long-running, so the GitHub token stays in its
  # environment for as long as it runs (anyone who can run `docker inspect`
  # on this host can read it); stopping it removes it. Started and stopped
  # with deploy/scanworker.sh, behind a profile so `up` never needs the token.
  scanworker:
    image: vulnframework-sweep:${VF_IMAGE_TAG:-v1}
    profiles: ["worker"]
    restart: unless-stopped
    environment:
      VULNFRAMEWORK_GITHUB_TOKEN: ${VULNFRAMEWORK_GITHUB_TOKEN:-}
      # NuGuard's API key, from the caller's environment like the token, and
      # exposed the same way (docker inspect). Empty when NuGuard is off.
      VULNFRAMEWORK_NUGUARD_API_KEY: ${VULNFRAMEWORK_NUGUARD_API_KEY:-}
    command:
      - "-worker"
      - "-dsn=postgres://vulnframework:${POSTGRES_PASSWORD}@db:5432/vulnframework?sslmode=disable"
      - "-github"
      - "-github-api=${VULNFRAMEWORK_GITHUB_API:-}"
      - "-download-root=/home/scanner/repos"
      - "-scan-timeout=${SCAN_TIMEOUT:-15m}"
      # NuGuard is off unless NUGUARD_URL is set (deploy/.env).
      - "-nuguard-url=${NUGUARD_URL:-}"
      - "-nuguard-tools=${NUGUARD_TOOLS:-}"
      - "-nuguard-include-posture=${NUGUARD_INCLUDE_POSTURE:-false}"
      - "-nuguard-timeout=${NUGUARD_TIMEOUT:-10m}"
      # The operator's ceiling: what security owners may choose in the
      # interface, never more (DEPLOY.md, "NuGuard controls").
      - "-nuguard-allow-tools=${NUGUARD_ALLOW_TOOLS:-nga-rules,atlas,semgrep}"
      - "-nuguard-allow-posture=${NUGUARD_ALLOW_POSTURE:-true}"
      - "-nuguard-max-timeout=${NUGUARD_MAX_TIMEOUT:-10m}"
      - "-nuguard-sbom-max-bytes=${NUGUARD_SBOM_MAX_BYTES:-4194304}"
      - "-tools=/opt/vf/config/tools.lock"
      - "-calibration=/opt/vf/config/calibration.yaml"
      - "-policy=/opt/vf/config/policy.yaml"
      - "-kev-url=${KEV_URL:-https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}"
      - "-epss-url=${EPSS_URL:-https://epss.empiricalsecurity.com/epss_scores-current.csv.gz}"
      - "-max-concurrent=${SWEEP_CONCURRENCY:-2}"
    volumes:
      - scanhome:/home/scanner
    depends_on:
      migrate: { condition: service_completed_successfully }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # NuGuard, the opt-in remote AI code-rule and inventory scanner
  # (DECISIONS-NEEDED D13 amendment). Off unless NUGUARD_URL is set, and
  # started with the scan worker by deploy/scanworker.sh.
  #
  # A sidecar in the scan worker's network namespace, not a service on the
  # compose network: it binds 127.0.0.1 there (deploy/nuguard.yaml), so it is
  # reachable from the worker alone, publishes nothing, and the API key and
  # the GitHub token in each request cross no network. That is why it needs
  # neither TLS nor trust_proxy: NuGuard accepts a loopback bind without
  # either, and the worker's client accepts plain http only to loopback.
  # Its egress is the worker's: it clones from github.com and, with the
  # default tools and network: false, reaches nothing else.
  #
  # The image is built from the NuGuard repository and must pass its own
  # readiness check before this is enabled (DEPLOY.md, "NuGuard").
  nuguard:
    image: ${NUGUARD_IMAGE:-nuguard-service:0.9.15}
    profiles: ["nuguard"]
    network_mode: "service:scanworker"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 4g
    environment:
      NUGUARD_SERVICE_KEY_VF_SHA256: ${NUGUARD_API_KEY_SHA256:-}
      NUGUARD_IMAGE_DIGEST: ${NUGUARD_IMAGE_DIGEST:-}
    volumes:
      - nuguard_data:/var/lib/nuguard
      - ./nuguard.yaml:/etc/nuguard/nuguard.yaml:ro
    depends_on:
      - scanworker

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  scanhome:
  nuguard_data:

# config/tools.lock — pinned scanner versions (VM-AD §8.3).
#
# Every tool is pinned to an exact version. The scanner image is built from this
# file and identified by digest. The digest and every tool version are recorded
# on the run (VM-F-202): a change in finding counts is uninterpretable without
# knowing whether the scanner changed.
#
# Format: one record per line, whitespace separated.
#   tool  <name>  <version>
#   image <reference>
#
# These versions were verified to exist and were used to build the image the
# fixtures in testdata/fixtures were captured from. Phase 1's values were
# placeholders and did not all correspond to real releases; see BUILD-LOG A6.
#
# Rebuild the image on a schedule. A scanner image rebuild is itself a change
# and should show up as a delta in the next report.

tool  govulncheck   v1.8.0
tool  gosec         v2.29.0
tool  staticcheck   v0.8.1
tool  osv-scanner   v2.6.0
tool  gitleaks      v8.30.1
tool  trivy         v0.74.0
tool  semgrep       1.177.0
tool  npm-audit     10.8.2
tool  actions-pin   v1.0.0

image vulnframework-scanner:v1

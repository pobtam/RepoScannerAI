# Synthetic configuration for scanner fixtures. The credentials below are
# placeholders that capture.sh expands, in its copy, to fabricated values from
# internal/testkeys, so no key-like string is committed. They are deliberately
# NOT the AWS documentation example key, which gitleaks allowlists.
service: wanaware-api
region: eu-west-1
aws_access_key_id: @@TESTKEY:aws-access-key-id@@
aws_secret_access_key: @@TESTKEY:aws-secret-access-key@@
timeout_seconds: 30
